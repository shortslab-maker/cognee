server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    # Reduce batch size and increase wait to avoid Loki ingestion rate limit (HTTP 429)
    batchsize: 32768       # bytes per batch (32KB)
    batchwait: 5s         # maximum time to wait before sending a batch
    timeout: 10s
    # Optional: tune retry/backoff if Loki returns 429
    backoff_config:
      min_period: 1s
      max_period: 30s

scrape_configs:
  - job_name: lmstudio
    static_configs:
      - targets:
          - localhost
        labels:
          job: lmstudio
          __path__: /var/log/lmstudio/**/*.log
  - job_name: cognee
    static_configs:
      - targets:
          - localhost
        labels:
          job: cognee
          __path__: /var/log/cognee/*.log

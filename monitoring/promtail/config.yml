server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: lmstudio
    static_configs:
      - targets:
          - localhost
        labels:
          job: lmstudio
          __path__: /var/log/lmstudio/**/*.log
  - job_name: cognee
    static_configs:
      - targets:
          - localhost
        labels:
          job: cognee
          __path__: /var/log/cognee/*.log
